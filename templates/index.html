<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Massive Stock Watchlist</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
      max-width: 680px;
      margin: 0 auto;
      padding: 48px 20px;
      color: #1a2233;
      background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 45%, #fdf2f8 100%);
      min-height: 100vh;
    }
    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 40px rgba(30, 41, 59, 0.12);
    }
    h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: -0.5px; }
    .hint { color: #64748b; font-size: 14px; line-height: 1.5; margin: 0 0 24px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
    .row { display: flex; gap: 12px; align-items: stretch; flex-wrap: wrap; }
    input[type="text"] {
      flex: 1 1 220px;
      padding: 11px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      background: #f8fafc;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
      background: #ffffff;
    }
    button {
      padding: 11px 22px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
      transition: filter 0.15s, box-shadow 0.15s, transform 0.1s;
    }
    button:hover { filter: brightness(1.08); box-shadow: 0 6px 18px rgba(79, 70, 229, 0.45); }
    button:active { transform: translateY(1px); }
    #result {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      white-space: pre-wrap;
      font-size: 14px;
      min-height: 20px;
      background: #f1f5f9;
      color: #475569;
    }
    #result.success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    #result.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    table { width: 100%; margin-top: 28px; border-collapse: collapse; font-size: 15px; }
    th, td { text-align: left; padding: 12px 10px; }
    th {
      font-size: 12px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 2px solid #e2e8f0;
    }
    tbody tr { border-bottom: 1px solid #eef2f7; transition: background 0.12s; }
    tbody tr:nth-child(even) { background: #f8fafc; }
    tbody tr:hover { background: #eef2ff; }
    .delete-btn {
      padding: 6px 12px;
      border: 1px solid #fecaca;
      border-radius: 8px;
      background: #fef2f2;
      color: #991b1b;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .delete-btn:hover { background: #fee2e2; border-color: #fca5a5; box-shadow: 0 2px 8px rgba(153, 27, 27, 0.15); }
    .delete-btn:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <main class="card">
  <h1>Stock Watchlist</h1>
  <p class="hint">Enter a single ticker symbol. This sends exactly ONE call to the Massive API to fetch the latest price, then adds it to your watchlist.</p>

  <form id="stock-form">
    <label for="symbol">Ticker symbol</label>
    <div class="row">
      <input type="text" id="symbol" name="symbol" placeholder="AAPL" required>
      <button type="submit">Add to watchlist</button>
    </div>
  </form>

  <div id="result"></div>

  <table id="watchlist-table">
    <thead>
      <tr>
        <th>Symbol</th>
        <th>Email</th>
        <th>Latest price</th>
        <th>Updated</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="watchlist-body"></tbody>
  </table>
  </main>

  <script>
    const form = document.getElementById("stock-form");
    const resultEl = document.getElementById("result");
    const watchlistBody = document.getElementById("watchlist-body");

    async function loadWatchlist() {
      try {
        const resp = await fetch("/watchlist");
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.className = "error";
          resultEl.textContent = "Error loading watchlist: " + (data.error || resp.statusText);
          return;
        }
        watchlistBody.innerHTML = "";
        data.forEach((row) => {
          const tr = document.createElement("tr");
          const price = row.latest_price !== null && row.latest_price !== undefined
            ? Number(row.latest_price).toFixed(2)
            : "-";
          const updated = row.updated_at ? new Date(row.updated_at).toLocaleString() : "-";
          tr.innerHTML = `<td>${row.symbol}</td><td>${row.email || "-"}</td><td>${price}</td><td>${updated}</td>`;
          const delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.className = "delete-btn";
          delBtn.textContent = "Remove";
          delBtn.setAttribute("aria-label", "Remove " + row.symbol + " from watchlist");
          delBtn.addEventListener("click", () => removeFromWatchlist(row.symbol));
          const actionsTd = document.createElement("td");
          actionsTd.appendChild(delBtn);
          tr.appendChild(actionsTd);
          watchlistBody.appendChild(tr);
        });
      } catch (err) {
        resultEl.className = "error";
        resultEl.textContent = "Failed to load watchlist: " + err;
      }
    }

    async function removeFromWatchlist(symbol) {
      resultEl.className = "";
      resultEl.textContent = "Removing " + symbol + "...";

      try {
        const resp = await fetch("/watchlist/" + encodeURIComponent(symbol), {
          method: "DELETE",
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.className = "error";
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          return;
        }
        resultEl.className = "success";
        resultEl.textContent = "Removed " + symbol + " from watchlist.";
        loadWatchlist();
      } catch (err) {
        resultEl.className = "error";
        resultEl.textContent = "Request failed: " + err;
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const symbol = document.getElementById("symbol").value;
      resultEl.className = "";
      resultEl.textContent = "Adding to watchlist...";

      try {
        const resp = await fetch("/watchlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          resultEl.className = "error";
          resultEl.textContent = "Error: " + (data.error || resp.statusText);
          return;
        }
        resultEl.className = "success";
        resultEl.textContent = "Added " + data.symbol + " at price " + data.latest_price;
        document.getElementById("symbol").value = "";
        loadWatchlist();
      } catch (err) {
        resultEl.className = "error";
        resultEl.textContent = "Request failed: " + err;
      }
    });

    loadWatchlist();
  </script>
</body>
</html>
